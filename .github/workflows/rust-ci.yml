name: rust-ci

on:
  push:
    branches: [main]
    paths: ["rust/**", ".github/workflows/rust-ci.yml", "scripts/**"]
  pull_request:
    paths: ["rust/**", ".github/workflows/rust-ci.yml", "scripts/**"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

defaults:
  run:
    working-directory: rust

jobs:
  lint-and-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml pins the version; rustup picks it up automatically.
      - name: Install toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Environment report (read-only)
        run: ../scripts/check-environment.sh || true

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --all-targets

      - name: Unit tests
        run: cargo test --workspace

      - name: Header check (compile vendored homa.h with cc)
        if: runner.os == 'Linux'
        run: cargo test -p homa-sys --features header-check

      - name: C ABI header check (compile homa_ffi.h with cc)
        run: cargo test -p homa-ffi --features header-check

      - name: Docs
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Release native library
        run: cargo build --release -p homa-ffi

      - name: Native library symbols and C example (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          SO=target/release/libhoma_ffi.so
          test -f "$SO"
          echo "== exported homa_* symbols"
          # GNU nm prints homa_socket_open@@HOMA_FFI_1 when a version script
          # is in use. Strip the version tag before comparing.
          nm -D --defined-only "$SO" | awk '/ T / {print $3}' | sed 's/@@.*//; s/@.*//' | sort -u > /tmp/homa-syms.txt
          awk '/^[[:space:]]+homa_/ { gsub(/;/, ""); print $1 }' crates/homa-ffi/homa_ffi.map | sort -u > /tmp/homa-expected.txt
          echo "-- exported"; cat /tmp/homa-syms.txt
          echo "-- expected"; cat /tmp/homa-expected.txt
          diff -u /tmp/homa-expected.txt /tmp/homa-syms.txt
          echo "== native dependencies"
          ldd "$SO"
          echo "== compile public header as C11"
          echo '#include "homa_ffi.h"' | cc -std=c11 -I crates/homa-ffi/include -x c -c -o /tmp/homa_ffi.o -
          echo "== C smoke-test client"
          cmake -S examples/ffi-client -B /tmp/ffi-client-build \
            -DHOMA_FFI_LIB_DIR="$PWD/target/release"
          cmake --build /tmp/ffi-client-build
          /tmp/ffi-client-build/ffi-client --help >/dev/null


  cross-check:
    name: cross-check ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo clippy --workspace --all-targets --target ${{ matrix.target }} -- -D warnings
      - name: Install aarch64 linker
        run: sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
      - name: Cross-compile libhoma_ffi.so
        run: cargo build --release -p homa-ffi --target ${{ matrix.target }}
        env:
          # This env var overrides cargo:rustc-linker. Point it at the wrapper
          # so rustc's anonymous version script is not passed to ld.bfd 2.46.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ github.workspace }}/rust/crates/homa-ffi/link-linux.sh

  # Kernel integration tests need a host with homa.ko loaded; GitHub-hosted
  # runners cannot load out-of-tree modules. Run on a self-hosted runner
  # labelled `homa` (opt-in; the job is skipped when no such runner exists).
  kernel-integration:
    name: kernel integration (self-hosted, homa)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[homa-integration]')
    runs-on: [self-hosted, linux, homa]
    steps:
      - uses: actions/checkout@v4
      - run: ../scripts/run-integration.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: homa-integration-results
          path: tests/integration/results/
