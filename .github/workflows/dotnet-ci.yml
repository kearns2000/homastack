name: dotnet-ci

# Builds libhoma_ffi, then builds and tests Homa.NET and Homa.Rpc.
# Socket open is expected to fail on the runner (no homa.ko). Homa.Rpc tests
# do not open a socket. This does not execute a Homa RPC.

on:
  push:
    branches: [main]
    paths:
      - "dotnet/**"
      - "rust/crates/homa-ffi/**"
      - "rust/crates/homa-rs/**"
      - "rust/crates/homa-sys/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/rust-toolchain.toml"
      - ".github/workflows/dotnet-ci.yml"
  pull_request:
    paths:
      - "dotnet/**"
      - "rust/crates/homa-ffi/**"
      - "rust/crates/homa-rs/**"
      - "rust/crates/homa-sys/**"
      - "rust/Cargo.toml"
      - "rust/Cargo.lock"
      - "rust/rust-toolchain.toml"
      - ".github/workflows/dotnet-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        working-directory: rust
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build libhoma_ffi
        working-directory: rust
        run: cargo build --release -p homa-ffi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test Homa.NET
        working-directory: dotnet
        env:
          HOMA_FFI_PATH: ${{ github.workspace }}/rust/target/release/libhoma_ffi.so
        run: dotnet test HomaStack.slnx --configuration Release
